# cargo-deny: run in CI (`cargo deny check`). Licenses are the ones the
# current dependency tree uses; a new license is a decision, not a bump.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    # webpki-roots: Mozilla's root list.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
# Workspace crates depend on each other by path without a version.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
