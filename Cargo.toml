[workspace]
resolver = "2"
members = [
    "crates/probe-common",
    "crates/probe-client",
    "crates/probe-server",
    "crates/probe-analyzer",
    "crates/probe-report",
    "crates/astp-types",
    "crates/astp-frame",
    "crates/astp-crypto",
    "crates/astp-transport",
    "crates/astp-session",
    "crates/astp-tun",
    "crates/astp-client",
    "crates/astp-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
probe-common = { path = "crates/probe-common" }
probe-analyzer = { path = "crates/probe-analyzer" }
probe-report = { path = "crates/probe-report" }
astp-types = { path = "crates/astp-types" }
astp-frame = { path = "crates/astp-frame" }
astp-crypto = { path = "crates/astp-crypto" }
astp-transport = { path = "crates/astp-transport" }
astp-session = { path = "crates/astp-session" }
astp-tun = { path = "crates/astp-tun" }
astp-client = { path = "crates/astp-client" }
astp-server = { path = "crates/astp-server" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "signal", "sync", "fs"] }
tokio-util = "0.7"
socket2 = { version = "0.6", features = ["all"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = "1"
webpki-roots = "1"
rcgen = "0.14"
tempfile = "3"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "client-legacy"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
rand = "0.9"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
# Exact pins: h3-datagram 0.0.2 is built against this h3 and this h3-quinn.
# See crates/astp-transport/README.md.
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
h3-datagram = "=0.0.2"

[workspace.lints.rust]
unused = "warn"

[workspace.lints.clippy]
all = "warn"
