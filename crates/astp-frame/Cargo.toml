[package]
name = "astp-frame"
description = "ASTP-M v1 frame codec (spec draft 0.3 section 5)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
astp-types.workspace = true
# `BufMut::limit` so a payload read can use spare capacity without
# zero-filling it. The crate is already in the workspace lock.
bytes.workspace = true
rand.workspace = true
thiserror.workspace = true
# The codec uses AsyncRead (io-util) and nothing else from tokio.
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
# Integration tests name tokio directly (`#[tokio::test]`, `AsyncRead`).
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }

[lints]
workspace = true
