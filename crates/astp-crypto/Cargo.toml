[package]
name = "astp-crypto"
description = "ASTP-M TLS 1.3 configuration and authenticator contract"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Reference HMAC authenticator for tests of later tasks.
# Not a default feature and not a production credential format.
test-util = ["dep:ring", "dep:subtle"]

[dependencies]
astp-types.workspace = true
thiserror.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
webpki-roots.workspace = true
ring = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }

[dev-dependencies]
rcgen.workspace = true
ring.workspace = true
subtle.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time"] }
tokio-rustls.workspace = true

[lints]
workspace = true
